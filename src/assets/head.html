<!--
  VibeCode — WebView head injection
  Embedded so the app works with `cargo run` without a separate Tailwind build.
  For production, replace this with a compiled Tailwind CSS bundle.
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  /* ── Reset & base ─────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: dark;
    /* VibeCode design tokens */
    --canvas:        #0d1117;
    --canvas-subtle: #161b22;
    --canvas-inset:  #010409;
    --border:        #30363d;
    --border-muted:  #21262d;
    --fg:            #e6edf3;
    --fg-muted:      #8b949e;
    --fg-subtle:     #6e7681;
    --accent-blue:   #388bfd;
    --accent-green:  #3fb950;
    --accent-purple: #bc8cff;
    --accent-orange: #e3b341;
    --accent-red:    #f85149;
    --font-mono:     "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, SFMono-Regular, monospace;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--canvas);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ── Scrollbars ────────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-subtle); }
  ::selection { background: rgba(56, 139, 253, 0.35); }

  /* ── App shell ─────────────────────────────────────────────────────────── */
  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ── Frameless title bar ───────────────────────────────────────────────── */
  .titlebar {
    -webkit-app-region: drag;
    app-region: drag;
    height: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: var(--canvas-subtle);
    border-bottom: 1px solid var(--border-muted);
    gap: 12px;
    z-index: 100;
  }

  .titlebar-dots {
    display: flex;
    gap: 6px;
    -webkit-app-region: no-drag;
    app-region: no-drag;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-close    { background: #ff5f57; }
  .dot-minimize { background: #febc2e; }
  .dot-maximize { background: #28c840; }

  .titlebar-label {
    flex: 1;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-subtle);
    -webkit-app-region: no-drag;
    app-region: no-drag;
    pointer-events: none;
  }

  /* ── Three-column layout ───────────────────────────────────────────────── */
  .columns {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Sidebar ───────────────────────────────────────────────────────────── */
  .sidebar {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--canvas-subtle);
    border-right: 1px solid var(--border-muted);
    transition: width 200ms ease;
    overflow: hidden;
    z-index: 10;
  }

  .sidebar.collapsed { width: 48px; }
  .sidebar.expanded  { width: 220px; align-items: flex-start; }

  .sidebar-icons { display: flex; flex-direction: column; gap: 4px; padding: 8px; width: 100%; }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--fg-muted);
    transition: color 150ms, background 150ms;
    white-space: nowrap;
    overflow: hidden;
    width: 100%;
    border: none;
    background: transparent;
    font-family: var(--font-mono);
    font-size: 13px;
  }

  .sidebar-item:hover { color: var(--fg); background: var(--border-muted); }
  .sidebar-item.active { color: var(--fg); background: var(--border); }

  .sidebar-item .icon {
    font-size: 16px;
    flex-shrink: 0;
    width: 20px;
    text-align: center;
    line-height: 1;
  }

  .sidebar-item .label { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }

  .sidebar-divider { width: 100%; height: 1px; background: var(--border-muted); margin: 4px 0; }

  .sidebar-bottom { margin-top: auto; width: 100%; padding: 8px; }

  /* ── Editor pane ───────────────────────────────────────────────────────── */
  .editor-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--canvas);
    min-width: 0;
  }

  .editor-tabs {
    display: flex;
    align-items: stretch;
    background: var(--canvas-subtle);
    border-bottom: 1px solid var(--border);
    height: 36px;
    overflow-x: auto;
  }

  .editor-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    border-right: 1px solid var(--border-muted);
    font-size: 12px;
    color: var(--fg-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: color 150ms;
    user-select: none;
  }

  .editor-tab.active {
    color: var(--fg);
    background: var(--canvas);
    border-top: 2px solid var(--accent-blue);
    padding-top: 2px;
  }

  .editor-tab .tab-close {
    font-size: 10px;
    color: var(--fg-subtle);
    line-height: 1;
    border-radius: 3px;
    padding: 1px 2px;
  }

  .editor-tab .tab-close:hover { background: var(--border); color: var(--fg); }

  .editor-body {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* Line numbers gutter */
  .editor-gutter {
    display: flex;
    flex-direction: column;
    padding: 12px 12px 12px 8px;
    min-width: 48px;
    text-align: right;
    color: var(--fg-subtle);
    font-size: 12px;
    line-height: 1.7;
    background: var(--canvas);
    border-right: 1px solid var(--border-muted);
    overflow: hidden;
    user-select: none;
  }

  .editor-textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.7;
    padding: 12px 16px;
    caret-color: var(--accent-blue);
    tab-size: 4;
    white-space: pre;
    overflow-x: auto;
    overflow-y: auto;
    user-select: text;
  }

  .editor-textarea::placeholder { color: var(--fg-subtle); }

  .editor-statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 12px;
    height: 24px;
    background: var(--accent-blue);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    user-select: none;
    flex-shrink: 0;
  }

  .editor-statusbar .statusbar-right { margin-left: auto; display: flex; gap: 16px; }

  .statusbar-item { opacity: 0.85; cursor: pointer; }
  .statusbar-item:hover { opacity: 1; }

  /* ── Mobile Simulator ──────────────────────────────────────────────────── */
  .simulator-panel {
    display: flex;
    flex-direction: column;
    width: 320px;
    min-width: 280px;
    background: var(--canvas-inset);
    border-left: 1px solid var(--border);
    overflow: hidden;
    transition: width 200ms ease;
  }

  .simulator-panel.hidden { width: 0; min-width: 0; }

  .simulator-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    height: 36px;
    border-bottom: 1px solid var(--border);
    background: var(--canvas-subtle);
    flex-shrink: 0;
  }

  .simulator-header-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--fg-muted);
  }

  .simulator-header-actions { display: flex; gap: 6px; }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--fg-muted);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    line-height: 1;
    font-family: var(--font-mono);
    transition: color 150ms, background 150ms;
  }
  .icon-btn:hover { color: var(--fg); background: var(--border-muted); }

  .simulator-viewport {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow: hidden;
  }

  /* Phone frame — fixed 9:19.5 aspect ratio */
  .phone-frame {
    --phone-w: 220px;
    --phone-h: calc(var(--phone-w) * 19.5 / 9);
    width: var(--phone-w);
    height: var(--phone-h);
    background: #1c1c1e;
    border-radius: 36px;
    border: 2px solid #3a3a3c;
    box-shadow:
      0 0 0 1px #2c2c2e,
      0 24px 80px rgba(0, 0, 0, 0.85),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  .phone-notch {
    width: 80px;
    height: 26px;
    background: #000;
    border-radius: 0 0 16px 16px;
    margin: 0 auto;
    flex-shrink: 0;
    z-index: 2;
  }

  .phone-screen {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 6px;
    min-height: 0;
  }

  .phone-screen-content {
    flex: 1;
    overflow: hidden;
    background: #000;
    border-radius: 4px;
    padding: 8px 6px;
  }

  .phone-code-preview {
    font-family: var(--font-mono);
    font-size: 5.5px;
    line-height: 1.5;
    color: #e6edf3;
    white-space: pre-wrap;
    word-break: break-all;
    overflow: hidden;
    height: 100%;
    user-select: none;
  }

  .phone-home-bar {
    width: 100px;
    height: 4px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 2px;
    margin: 8px auto 10px;
    flex-shrink: 0;
  }

  .simulator-info {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 8px 12px;
    border-top: 1px solid var(--border-muted);
    background: var(--canvas-subtle);
  }

  .simulator-badge {
    font-size: 10px;
    color: var(--fg-subtle);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* ── Utility helpers ───────────────────────────────────────────────────── */
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flex-center { display: flex; align-items: center; justify-content: center; }
</style>
